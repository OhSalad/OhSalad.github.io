name: Publish launcher server information
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/announcements.json'
permissions:
  contents: write
  pages: write
concurrency:
  group: launcher-info-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read public server counters
        env:
          COLLECTOR_KEY: ${{ secrets.TOPDX_LAUNCHER_INFO_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/launcher-info-key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$COLLECTOR_KEY" > "$key"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.github/production_known_hosts \
            root@82.38.139.13 public-info > "$RUNNER_TEMP/server-info.json"
          python3 .github/scripts/publish-launcher-info.py "$RUNNER_TEMP/server-info.json"
      - name: Publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TOPDX server information'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/server-info.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public launcher server information'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
