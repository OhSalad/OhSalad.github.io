name: Validate launcher announcements
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/announcements.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate editorial document
        run: python3 .github/scripts/announcements.py launcher/announcements.json
